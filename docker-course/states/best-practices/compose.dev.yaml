services:
  app:
    image: docker-course:dev
    develop:
      watch:
        - action: sync+restart
          path: ./message.txt
          target: /app/message.txt
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
    build:
      context: .
      dockerfile: Dockerfile.production
      target: dev
